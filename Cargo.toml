[package]
name = "zettel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Obsidian-compatible CLI for wikilinks: links, backlinks, unresolved, find, check-links"
license = "Apache-2.0"
repository = "https://github.com/mgajewskik/zettel"
readme = "README.md"
keywords = ["obsidian", "zettelkasten", "wikilink", "cli", "markdown"]
categories = ["command-line-utilities"]

[[bin]]
name = "zettel"
path = "src/main.rs"

[dependencies]
obsidian-rs-core = "0.6"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
