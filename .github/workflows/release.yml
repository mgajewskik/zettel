name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins channel = "stable" (MSRV ≥1.88 / edition 2024)

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fix known-bad rayon checksum in Cargo.lock
        run: |
          sed -i 's/24cbfba30926d/24cfbfa30926d/' Cargo.lock

      - name: Run tests
        run: cargo test --locked

  build:
    name: build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: zettel-linux-x86_64
            binary: zettel
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: zettel-macos-aarch64
            binary: zettel
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: zettel-macos-x86_64
            binary: zettel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: zettel-windows-x86_64
            binary: zettel.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fix known-bad rayon checksum in Cargo.lock
        shell: bash
        run: |
          sed -i.bak 's/24cbfba30926d/24cfbfa30926d/' Cargo.lock || sed -i '' 's/24cbfba30926d/24cfbfa30926d/' Cargo.lock

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          dest="dist/${{ matrix.asset }}"
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            dest="${dest}.exe"
          fi
          cp "$src" "$dest"
          echo "ARTIFACT=$dest" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
