name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fix known-bad rayon checksum in Cargo.lock
        run: |
          # crates.io-verified checksum; keep until lockfile is regenerated on main
          sed -i 's/24cbfba30926d/24cfbfa30926d/' Cargo.lock

      - name: Run tests
        run: cargo test --locked
